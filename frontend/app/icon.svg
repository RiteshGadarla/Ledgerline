<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Ledgerline</title>
  <!-- Self-contained on the rail ground: a favicon has no page to inherit
       colour from, so the mark carries its own dark tile rather than
       currentColor, and takes the brighter dark-theme readout for the
       settled point so it holds up against a browser's own chrome. -->
  <rect width="32" height="32" rx="7.5" fill="#11151c"/>
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <path d="M7.5 10.5h7.5"/>
    <path d="M7.5 16h7.5"/>
    <path d="M7.5 21.5h7.5" opacity="0.62"/>
    <!-- the tie-out -->
    <path d="M19 11v10" opacity="0.34"/>
  </g>
  <circle cx="19" cy="16" r="3.6" fill="#2ee0c8"/>
</svg>
