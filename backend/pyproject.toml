[project]
name = "ledgerline-api"
version = "0.1.0"
description = "Ledgerline reconciliation engine and API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "contracts", "money", "engine", "datagen", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = false
packages = ["app", "contracts", "money", "engine", "datagen", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.importlinter]
root_packages = ["app", "contracts", "money", "engine", "datagen"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engine stays pure"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["db", "llm", "app", "random"]

[[tool.importlinter.contracts]]
name = "datagen stays pure"
type = "forbidden"
source_modules = ["datagen"]
forbidden_modules = ["db", "llm", "app"]
